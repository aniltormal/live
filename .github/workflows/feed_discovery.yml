name: Live Darshan Automatic Feed Discovery

on:
  schedule:
    # दर ६० मिनिटांनी स्वयंचलित स्कॅन (₹0 Free Tier सुरक्षित)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r feed_discovery/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Live Darshan Feed Scanner
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DB_URL: https://livedarshan-204ed-default-rtdb.asia-southeast1.firebasedatabase.app
        run: python feed_discovery/scanner.py
        
