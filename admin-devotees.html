<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🙏 नोंदणीकृत भक्त व्यवस्थापन — दर्शन सेतू अ‍ॅडमिन</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Khand:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    body { font-size: 15.5px; }
    @keyframes dsModalPopIn { 0% { opacity: 0; transform: scale(0.9) translateY(14px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .ds-modal-card { animation: dsModalPopIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes adminSkelShimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .admin-skel { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 800px 100%; animation: adminSkelShimmer 1.3s infinite linear; }
    input, select, textarea { font-size: 15px !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header id="adminTopHeader" class="sticky top-0 z-50 w-full bg-gradient-to-r from-[#04283d] via-[#05344E] to-[#0a4d70] text-white border-b-2 border-amber-400/80 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <a href="admin.html" class="px-3 py-1.5 rounded-xl bg-white/20 text-white text-xs sm:text-sm font-extrabold">← डॅशबोर्ड</a>
        <h1 class="text-base sm:text-xl font-extrabold">🙏 नोंदणीकृत भक्त व्यवस्थापन</h1>
      </div>
      <a href="index.html" class="px-3 py-1.5 rounded-xl bg-white/15 text-white text-xs sm:text-sm font-bold">🏠 मुख्य पेज</a>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 pb-20">
    <div id="authGateMsg" class="w-full space-y-4">
      <div class="h-20 w-full rounded-2xl admin-skel border border-slate-200/70"></div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="h-20 rounded-2xl admin-skel border border-slate-200/70"></div>
        <div class="h-20 rounded-2xl admin-skel border border-slate-200/70"></div>
        <div class="h-20 rounded-2xl admin-skel border border-slate-200/70"></div>
        <div class="h-20 rounded-2xl admin-skel border border-slate-200/70"></div>
      </div>
      <div class="h-32 w-full rounded-2xl admin-skel border border-slate-200/70"></div>
    </div>

    <div id="pageContent" class="hidden space-y-4 fade-in-up">
      <div class="bg-gradient-to-r from-[#031926] via-[#05344E] to-[#084160] text-white rounded-2xl p-4 sm:p-5 shadow-md border border-amber-400/60 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold text-amber-300">🙏 नोंदणीकृत भक्त व्यवस्थापन</h2>
          <p class="text-xs sm:text-sm text-slate-200 mt-0.5">मेरिट-डिमिरिट, व्हेरिफाइड बॅज, ब्लॉक/अनब्लॉक, जेंडर विश्लेषण, वाढदिवस शुभेच्छा व वैयक्तिक सूचना</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onclick="openReportsModal()" class="px-4 py-2 rounded-xl bg-white hover:bg-amber-50 text-[#05344E] text-xs font-extrabold shadow-sm transition">⚠️ तक्रार निवारण (<span id="kpiReports">0</span>)</button>
          <button id="refreshUsersBtn" type="button" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-[#031926] text-xs font-extrabold shadow-sm transition">🔄 रिफ्रेश</button>
        </div>
      </div>

      <div id="analyticsSummary" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-sm"></div>

      <section data-no-accordion="1" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5 space-y-4">
        <div class="flex flex-wrap gap-2" id="userFilterTabs">
          <button type="button" id="uFiltAll" onclick="setUserFilter('all')" class="px-3.5 py-2 rounded-xl bg-[#05344E] text-amber-300 text-xs font-extrabold">👥 सर्व भक्त (<span id="uCntAll">0</span>)</button>
          <button type="button" id="uFiltVer" onclick="setUserFilter('verified')" class="px-3.5 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-extrabold">✓ व्हेरिफाइड (<span id="uCntVer">0</span>)</button>
          <button type="button" id="uFiltLow" onclick="setUserFilter('low')" class="px-3.5 py-2 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-extrabold">⚠️ बॅज रद्द / १ पॉईंट (<span id="uCntLow">0</span>)</button>
          <button type="button" id="uFiltBlk" onclick="setUserFilter('blocked')" class="px-3.5 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 text-xs font-extrabold">🚫 ब्लॉक (<span id="uCntBlk">0</span>)</button>
          <button type="button" id="uFiltBday" onclick="setUserFilter('bday')" class="px-3.5 py-2 rounded-xl bg-sky-50 border border-sky-200 text-sky-900 text-xs font-extrabold">🎂 वाढदिवस (<span id="uCntBday">0</span>)</button>
        </div>

        <div class="space-y-2.5">
          <div class="relative">
            <input id="userSearchInp" type="text" placeholder="🔍 नाव किंवा ईमेलने भक्त शोधा..." class="w-full rounded-xl border-[1.5px] border-[#05344E]/35 bg-[#EEF5FA]/60 pl-3.5 pr-9 py-2.5 text-sm font-bold text-[#031926] outline-none focus:border-[#05344E]" />
            <button id="clearUserSearchBtn" type="button" onclick="document.getElementById('userSearchInp').value='';this.classList.add('hidden');renderUsersList();" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-extrabold">✕</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <!-- जिल्हा कस्टम सर्च ड्रॉप-डाऊन -->
            <div class="relative" id="userDistDDWrap">
              <button type="button" onclick="toggleDevoteeDD('userDistDDPanel')" class="w-full rounded-xl border-[1.5px] border-[#05344E]/35 bg-[#EEF5FA] px-3.5 py-2.5 text-sm font-bold text-[#031926] flex items-center justify-between gap-2 text-left shadow-sm">
                <span id="userDistLabel" class="truncate">📍 सर्व जिल्हे</span>
                <span class="text-xs text-[#05344E] shrink-0">▾</span>
              </button>
              <div id="userDistDDPanel" class="hidden absolute left-0 right-0 top-full mt-1 z-40 bg-white border-[1.5px] border-[#05344E]/40 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-2 bg-[#EEF5FA] border-b border-[#C8DFEE]">
                  <input id="userDistSearch" type="text" placeholder="🔍 जिल्हा शोधा..." oninput="filterDevoteeOpts('dist', this.value)" class="w-full rounded-xl border border-[#C3D9E8] px-3 py-1.5 text-sm bg-white outline-none" />
                </div>
                <div id="userDistDDList" class="max-h-52 overflow-y-auto divide-y divide-slate-100"></div>
              </div>
              <input id="userDistFilter" type="hidden" value="" />
            </div>

            <!-- गाव / शहर कस्टम सर्च ड्रॉप-डाऊन -->
            <div class="relative" id="userCityDDWrap">
              <button type="button" onclick="toggleDevoteeDD('userCityDDPanel')" class="w-full rounded-xl border-[1.5px] border-[#05344E]/35 bg-[#EEF5FA] px-3.5 py-2.5 text-sm font-bold text-[#031926] flex items-center justify-between gap-2 text-left shadow-sm">
                <span id="userCityLabel" class="truncate">🏘️ सर्व गाव / शहर</span>
                <span class="text-xs text-[#05344E] shrink-0">▾</span>
              </button>
              <div id="userCityDDPanel" class="hidden absolute left-0 right-0 top-full mt-1 z-40 bg-white border-[1.5px] border-[#05344E]/40 rounded-2xl shadow-xl overflow-hidden">
                <div class="p-2 bg-[#EEF5FA] border-b border-[#C8DFEE]">
                  <input id="userCitySearch" type="text" placeholder="🔍 गाव / शहर शोधा..." oninput="filterDevoteeOpts('city', this.value)" class="w-full rounded-xl border border-[#C3D9E8] px-3 py-1.5 text-sm bg-white outline-none" />
                </div>
                <div id="userCityDDList" class="max-h-52 overflow-y-auto divide-y divide-slate-100"></div>
              </div>
              <input id="userCityFilter" type="hidden" value="" />
            </div>

            <!-- जेंडर कस्टम ड्रॉप-डाऊन -->
            <div class="relative" id="userGenderDDWrap">
              <button type="button" onclick="toggleDevoteeDD('userGenderDDPanel')" class="w-full rounded-xl border-[1.5px] border-[#05344E]/35 bg-[#EEF5FA] px-3.5 py-2.5 text-sm font-bold text-[#031926] flex items-center justify-between gap-2 text-left shadow-sm">
                <span id="userGenderLabel" class="truncate">👥 सर्व जेंडर</span>
                <span class="text-xs text-[#05344E] shrink-0">▾</span>
              </button>
              <div id="userGenderDDPanel" class="hidden absolute left-0 right-0 top-full mt-1 z-40 bg-white border-[1.5px] border-[#05344E]/40 rounded-2xl shadow-xl overflow-hidden divide-y divide-slate-100">
                <button type="button" onclick="pickDevoteeDD('gender','','👥 सर्व जेंडर')" class="w-full text-left px-3.5 py-2 text-sm font-bold hover:bg-[#EEF5FA]">👥 सर्व जेंडर</button>
                <button type="button" onclick="pickDevoteeDD('gender','पुरुष','👨 पुरुष')" class="w-full text-left px-3.5 py-2 text-sm font-bold hover:bg-[#EEF5FA]">👨 पुरुष</button>
                <button type="button" onclick="pickDevoteeDD('gender','महिला','👩 महिला')" class="w-full text-left px-3.5 py-2 text-sm font-bold hover:bg-[#EEF5FA]">👩 महिला</button>
                <button type="button" onclick="pickDevoteeDD('gender','इतर','🙏 इतर')" class="w-full text-left px-3.5 py-2 text-sm font-bold hover:bg-[#EEF5FA]">🙏 इतर</button>
              </div>
              <input id="userGenderFilter" type="hidden" value="" />
            </div>
          </div>
        </div>
        <div id="userSearchMeta" class="text-xs font-bold text-slate-500"></div>

        <div id="usersListWrap" class="space-y-3"></div>
      </section>
    </div>
  </main>

  <!-- तक्रार निवारण डॅशबोर्ड पॉपअप -->
  <div id="reportsDashModal" class="hidden fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4" onclick="if(event.target===this)closeReportsModal()">
    <div class="ds-modal-card w-full max-w-3xl bg-white rounded-3xl shadow-2xl border-2 border-amber-400/75 max-h-[86vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-[#031926] via-[#05344E] to-[#084160] text-white border-b-2 border-amber-400/75">
        <div class="text-lg font-extrabold text-amber-300">📋 तक्रार निवारण डॅशबोर्ड</div>
        <button type="button" onclick="closeReportsModal()" class="w-8 h-8 rounded-xl bg-white/15 border border-amber-300/40 text-white text-sm font-bold">✕</button>
      </div>
      <div class="p-4 space-y-3 overflow-y-auto flex-1">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
          <button type="button" id="repFilterAllBtn" onclick="setReportFilter('all')" class="py-2.5 px-3 rounded-xl bg-[#05344E] text-amber-300 text-sm font-extrabold shadow-xs transition">📋 एकूण तक्रारी (<span id="repCntAll">0</span>)</button>
          <button type="button" id="repFilterPendingBtn" onclick="setReportFilter('pending')" class="py-2.5 px-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-sm font-extrabold transition">⏳ प्रलंबित तक्रारी (<span id="repCntPending">0</span>)</button>
          <button type="button" id="repFilterResolvedBtn" onclick="setReportFilter('resolved')" class="py-2.5 px-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-extrabold transition">✓ कार्यवाही केलेल्या (<span id="repCntResolved">0</span>)</button>
        </div>
        <div id="reportsListWrap" class="space-y-2.5"></div>
      </div>
    </div>
  </div>

  <!-- Inbuilt Advanced Confirm / Prompt Modal -->
  <div id="dsAdvModal" class="hidden fixed inset-0 z-[90] bg-black/65 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeAdvModal()">
    <div class="ds-modal-card w-full max-w-md bg-white rounded-3xl shadow-2xl border-2 border-amber-400/75 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-[#031926] via-[#05344E] to-[#084160] text-white border-b-2 border-amber-400/75">
        <div id="dsAdvTitle" class="text-base sm:text-lg font-extrabold text-amber-300">सूचना</div>
        <button type="button" onclick="closeAdvModal()" class="w-8 h-8 rounded-xl bg-white/15 border border-amber-300/40 text-white text-sm font-bold">✕</button>
      </div>
      <div class="p-4 sm:p-5 space-y-3.5">
        <div id="dsAdvMsg" class="text-sm font-bold text-slate-700 leading-relaxed"></div>
        <textarea id="dsAdvInput" rows="3" placeholder="येथे संदेश लिहा..." class="hidden w-full rounded-xl border-[1.5px] border-[#05344E]/30 bg-[#EEF5FA]/50 px-3 py-2 text-sm outline-none focus:border-[#05344E]"></textarea>
        <div class="flex items-center justify-end gap-2 pt-1">
          <button type="button" onclick="closeAdvModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-extrabold">रद्द करा</button>
          <button id="dsAdvOkBtn" type="button" class="px-5 py-2 rounded-xl bg-[#05344E] text-amber-300 text-sm font-extrabold shadow-sm">हो, पुढे जा</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toastBox" class="hidden"></div>
  <script src="admin-common.js?v=110"></script>
  <script>
    window.addEventListener('error', (ev) => {
      const g = document.getElementById('authGateMsg');
      if (g) g.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 border border-rose-300 text-rose-800 text-sm font-bold">❌ त्रुटी: ${ev.message || 'Unknown error'}</div>`;
    });
    let usersMap = {};
    let userFilterMode = 'all';
    let authDone = false;

    try {
      if (typeof renderAdminShell === 'function') renderAdminShell('devotees', '🙏 नोंदणीकृत भक्त व्यवस्थापन');
    } catch (e) { console.error(e); }

    setTimeout(() => {
      if (!authDone) {
        const g = document.getElementById('authGateMsg');
        if (g) g.innerHTML = '<div class="p-4 rounded-2xl bg-amber-50 border border-amber-300 text-[#05344E] text-sm font-bold space-y-2"><div>⏳ अ‍ॅडमिन लॉगिन तपासले जात आहे... जर पान उघडत नसेल तर कृपया <a href="admin.html" class="underline text-rose-700">अ‍ॅडमिन डॅशबोर्डवर</a> जाऊन पुन्हा लॉगिन करा.</div></div>';
      }
    }, 3500);

    function startDevoteesPage() {
      authDone = true;
      loadUsers();
      loadReports();
    }

    if (typeof initAdminGuard === 'function') {
      initAdminGuard((user) => {
        if (!user) return;
        startDevoteesPage();
      });
    } else if (typeof firebase !== 'undefined') {
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          const g = document.getElementById('authGateMsg'); if (g) g.classList.add('hidden');
          const c = document.getElementById('pageContent'); if (c) c.classList.remove('hidden');
          startDevoteesPage();
        } else {
          location.href = 'admin.html';
        }
      });
    }

    async function loadUsers() {
      const metaEl = document.getElementById('userSearchMeta');
      if (metaEl) metaEl.textContent = `दाखवत आहे: ${filtered.length} / ${allEntries.length} भक्त`;
      const box = document.getElementById('usersListWrap');
      if (box) box.innerHTML = '<div class="h-16 rounded-xl admin-skel"></div><div class="h-16 rounded-xl admin-skel"></div>';
      try {
        const snap = await (typeof fbDb !== "undefined" ? fbDb : firebase.database()).ref('shortsUsers').limitToLast(250).once('value');
        usersMap = snap.val() || {};
      } catch (err) {
        if (box) box.innerHTML = `<div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-bold">❌ भक्त यादी लोड करताना त्रुटी: ${err.message || err}</div>`;
        return;
      }
      const list = Object.entries(usersMap);
      const todayMD = new Date().toISOString().slice(5, 10);
      let bdayCount = 0, blockedCount = 0, maleC = 0, femaleC = 0, otherC = 0;
      const distCount = {};
      const cityCount = {};
      list.forEach(([, u]) => {
        if (u.dob && u.dob.slice(5, 10) === todayMD) bdayCount++;
        if (u.blocked) blockedCount++;
        if (u.gender === 'पुरुष') maleC++;
        else if (u.gender === 'महिला') femaleC++;
        else if (u.gender === 'इतर') otherC++;
        if (u.district) distCount[u.district] = (distCount[u.district] || 0) + 1;
        if (u.city && u.city.trim()) { const ct = u.city.trim(); cityCount[ct] = (cityCount[ct] || 0) + 1; }
      });
      const topDist = Object.entries(distCount).sort((a, b) => b[1] - a[1])[0];
      _distOpts = Object.entries(distCount).sort((a, b) => b[1] - a[1]);
      _cityOpts = Object.entries(cityCount).sort((a, b) => b[1] - a[1]);
      filterDevoteeOpts('dist', '');
      filterDevoteeOpts('city', '');
      document.getElementById('analyticsSummary').innerHTML = `
        <div class="p-3.5 rounded-2xl bg-white border border-slate-200 shadow-xs"><div class="text-slate-500 text-xs font-bold">एकूण भक्त</div><div class="text-2xl font-extrabold text-[#05344E]">${list.length}</div></div>
        <div class="p-3.5 rounded-2xl bg-white border border-slate-200 shadow-xs"><div class="text-slate-500 text-xs font-bold">आघाडीचा जिल्हा</div><div class="text-base font-extrabold text-[#05344E] truncate mt-1">${topDist ? topDist[0] + ' (' + topDist[1] + ')' : '—'}</div></div>
        <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 shadow-xs"><div class="text-sky-800 text-xs font-bold">👥 जेंडर विश्लेषण</div><div class="text-sm font-extrabold text-[#05344E] mt-1">👨 ${maleC} • 👩 ${femaleC} • 🙏 ${otherC}</div></div>
        <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 shadow-xs"><div class="text-amber-700 text-xs font-bold">🎂 वाढदिवस / 🚫 ब्लॉक</div><div class="text-base font-extrabold text-amber-800 mt-1">🎂 ${bdayCount} • 🚫 ${blockedCount}</div></div>
      `;
      renderUsersList();
    }

    window.setUserFilter = (mode) => {
      userFilterMode = mode || 'all';
      const mapCls = {
        all: ['uFiltAll', 'px-3.5 py-2 rounded-xl bg-[#05344E] text-amber-300 text-xs font-extrabold', 'px-3.5 py-2 rounded-xl bg-slate-100 border border-slate-200 text-[#05344E] text-xs font-extrabold'],
        verified: ['uFiltVer', 'px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold', 'px-3.5 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-extrabold'],
        low: ['uFiltLow', 'px-3.5 py-2 rounded-xl bg-amber-600 text-white text-xs font-extrabold', 'px-3.5 py-2 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-extrabold'],
        blocked: ['uFiltBlk', 'px-3.5 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold', 'px-3.5 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 text-xs font-extrabold'],
        bday: ['uFiltBday', 'px-3.5 py-2 rounded-xl bg-sky-600 text-white text-xs font-extrabold', 'px-3.5 py-2 rounded-xl bg-sky-50 border border-sky-200 text-sky-900 text-xs font-extrabold']
      };
      Object.entries(mapCls).forEach(([k, [id, onC, offC]]) => { const e = document.getElementById(id); if (e) e.className = k === userFilterMode ? onC : offC; });
      renderUsersList();
    };

    function renderUsersList() {
      const q = (document.getElementById('userSearchInp').value || '').trim().toLowerCase();
      const clrBtn = document.getElementById('clearUserSearchBtn');
      if (clrBtn) clrBtn.classList.toggle('hidden', !q);
      const dFilt = (document.getElementById('userDistFilter') && document.getElementById('userDistFilter').value) || '';
      const cFilt = (document.getElementById('userCityFilter') && document.getElementById('userCityFilter').value) || '';
      const gFilt = (document.getElementById('userGenderFilter') && document.getElementById('userGenderFilter').value) || '';
      const todayMD = new Date().toISOString().slice(5, 10);

      openAdvModal({
        title: '🗑️ भक्त नोंदणी कायमची हटवा',
        msg: `"${name}" यांची भक्त नोंदणी (shortsUsers) कायमची काढून टाकायची का? ही क्रिया पूर्ववत करता येणार नाही.`,
        okText: '🗑️ हो, कायमचे हटवा',
        okCls: 'px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-extrabold shadow-sm',
        onOk: async () => {
          await (typeof fbDb !== "undefined" ? fbDb : firebase.database()).ref(`shortsUsers/${uid}`).remove();
          showToast(`${name} यांची भक्त नोंदणी काढून टाकली!`);
          loadUsers();
        }
      });
    };
    window.wishBday = async (uid, name) => {
      await (typeof fbDb !== "undefined" ? fbDb : firebase.database()).ref('shortsBroadcasts').push({ targetUid: uid, title: '🎂 दर्शन सेतू टीम कडून वाढदिवसाच्या शुभेच्छा!', body: `🙏 नमस्कार ${name}, आपणास वाढदिवसाच्या हार्दिक भक्तीमय शुभेच्छा! श्री विठ्ठल-रुक्मिणी कृपेने आपले आयुष्य सुखमय होवो.`, createdAt: Date.now() });
      showToast(`${name} यांना वाढदिवसाच्या शुभेच्छा पाठवल्या!`);
    };

    document.getElementById('userSearchInp').oninput = renderUsersList;
    document.getElementById('refreshUsersBtn').onclick = loadUsers;
  </script>
</body>
</html>
