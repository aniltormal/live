<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>लेआउट, कॉलम व बटणे — लाईव्ह दर्शन अ‍ॅडमिन</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@400;600;700&family=Amiko:wght@400;600;700&family=Amita:wght@400;700&family=Anek+Devanagari:wght@400;600;700&family=Arya:wght@400;700&family=Asar&family=Bakbak+One&family=Baloo+2:wght@500;600;700&family=Biryani:wght@400;600;700&family=Cambay:wght@400;700&family=Dekko&family=Eczar:wght@400;600;700&family=Glegoo:wght@400;700&family=Gotu&family=Halant:wght@400;600;700&family=Hind:wght@400;600;700&family=Inknut+Antiqua:wght@400;600;700&family=Inter:wght@400;600;700&family=Jaldi:wght@400;700&family=Kadwa:wght@400;700&family=Kalam:wght@400;700&family=Karma:wght@400;600;700&family=Khand:wght@500;600;700&family=Khula:wght@400;600;700&family=Kurale&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@500;600;700&family=Martel+Sans:wght@400;600;700&family=Martel:wght@400;600;700&family=Modak&family=Mukta:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Noto+Serif+Devanagari:wght@400;600;700&family=Palanquin+Dark:wght@400;600;700&family=Palanquin:wght@400;600;700&family=Playpen+Sans+Deva:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Pragati+Narrow:wght@400;700&family=Rajdhani:wght@500;600;700&family=Rhodium+Libre&family=Rozha+One&family=Sahitya:wght@400;700&family=Sarala:wght@400;700&family=Sumana:wght@400;700&family=Sura:wght@400;700&family=Teko:wght@500;600;700&family=Tillana:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Tiro+Devanagari+Marathi:ital@0;1&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Vesper+Libre:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header id="adminTopHeader"></header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6">
    <div id="authGateMsg" class="p-6 rounded-2xl bg-white border border-slate-200 text-center text-sm font-semibold text-slate-600 shadow-sm">
      ⏳ अ‍ॅडमिन तपासणी सुरू आहे...
    </div>

    <div id="pageContent" class="hidden space-y-5 fade-in-up">
      <!-- विभाग मथळा व बॅनर -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-100">
          <h2 class="text-base sm:text-lg font-extrabold text-[#05344E]">🏷️ विभाग मथळा (Section Banner)</h2>
          <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
            <span>विभाग बॅनर दाखवा</span>
            <span class="toggle-pill"><input id="showSectionBannerToggle" type="checkbox" checked /><span class="knob"></span></span>
          </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">विभाग शीर्षक</label>
            <input id="sectionTitle" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" value="प्रमुख मंदिरांचे लाईव्ह दर्शन" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">विभाग उपशीर्षक</label>
            <input id="sectionSubtitle" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" value="खालीलपैकी कोणत्याही मंदिराच्या फोटोवर टॅप करून मोठ्या स्क्रीनवर अखंड दर्शन घ्या." />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">विभाग फॉन्ट (५० देवनागरी फॉन्ट्स)</label>
            <select id="sectionFontSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"></select>
            <div id="sectionFontPreview" class="mt-2 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-[#05344E]">प्रमुख मंदिरांचे लाईव्ह दर्शन</div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">मथळा आकार</label>
              <select id="sectionSizeSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                <option value="sm">लहान</option>
                <option value="md" selected>मध्यम</option>
                <option value="lg">मोठा</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">मजकूर रंग</label>
              <div class="flex items-center gap-1.5">
                <button id="swatchSectionText" type="button" class="w-10 h-10 rounded-xl border border-slate-300 shrink-0 cursor-pointer shadow-sm"></button>
                <input id="sectionTextColor" type="text" class="w-full px-2.5 py-2.5 rounded-xl border border-slate-300 text-xs font-mono" value="#05344E" />
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ग्रिड व कार्ड आकार -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <h2 class="text-base sm:text-lg font-extrabold text-[#05344E] pb-2 border-b border-slate-100">📐 मुख्य पेज व कार्ड आकार</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">एका ओळीतील मंदिर बटणे (Columns)</label>
            <select id="gridColsSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="1">१ बटण (एका खाली एक)</option>
              <option value="2" selected>२ बटणे (डिफॉल्ट)</option>
              <option value="3">३ बटणे</option>
              <option value="4">४ बटणे</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">हेडर उंची (Header Size)</label>
            <select id="headerSizeSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="sm">लहान</option>
              <option value="md" selected>मध्यम (डिफॉल्ट)</option>
              <option value="lg">मोठा</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">प्रमुख कार्ड उंची (Featured Height)</label>
            <select id="featuredHeightSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="sm">लहान</option>
              <option value="md" selected>मध्यम (डिफॉल्ट)</option>
              <option value="lg">मोठा</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">इतर कार्ड उंची (Card Height)</label>
            <select id="cardHeightSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="sm">लहान</option>
              <option value="md" selected>मध्यम (चौकोनी)</option>
              <option value="lg">मोठा</option>
            </select>
          </div>
        </div>
      </section>

      <!-- मंदिर बटण स्टाईल -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <h2 class="text-base sm:text-lg font-extrabold text-[#05344E] pb-2 border-b border-slate-100">🔘 मंदिर बटण फॉन्ट व रंग</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">बटण फॉन्ट (५० देवनागरी फॉन्ट्स)</label>
            <select id="btnFontSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"></select>
            <div id="btnFontPreview" class="mt-2 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-[#05344E]">श्री विठ्ठल-रुक्मिणी मंदिर</div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">बटण फॉन्ट आकार</label>
            <select id="btnFontSizeSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="12px">लहान (12px)</option>
              <option value="15px" selected>मध्यम (15px)</option>
              <option value="18px">मोठा (18px)</option>
              <option value="21px">खूप मोठा (21px)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">बटण मजकूर रंग</label>
            <div class="flex items-center gap-2">
              <button id="swatchBtnText" type="button" class="w-10 h-10 rounded-xl border border-slate-300 shrink-0 cursor-pointer shadow-sm"></button>
              <input id="btnTextColor" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" value="#FFFFFF" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">बटण पट्टी रंग (Background)</label>
            <div class="flex items-center gap-2">
              <button id="swatchBtnBg" type="button" class="w-10 h-10 rounded-xl border border-slate-300 shrink-0 cursor-pointer shadow-sm"></button>
              <input id="btnBgColor" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" value="#05344E" />
            </div>
          </div>
        </div>
      </section>

      <div class="sticky bottom-3 z-20 flex justify-end">
        <button id="saveLayoutBtn" type="button" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-gradient-to-r from-[#05344E] to-[#0a4d70] hover:opacity-95 text-white text-sm font-bold cursor-pointer shadow-lg transition">💾 लेआउट व बटणे सेव्ह करा</button>
      </div>
    </div>
  </main>

  <div id="toastBox" class="hidden"></div>

  <script src="admin-common.js"></script>
  <script>
    renderAdminShell('layout', 'लेआउट, कॉलम व बटणे');
    populateFontSelect('sectionFontSelect', 'sectionFontPreview');
    populateFontSelect('btnFontSelect', 'btnFontPreview');
    bindColorPicker('sectionTextColor', 'swatchSectionText', '#05344E');
    bindColorPicker('btnTextColor', 'swatchBtnText', '#FFFFFF');
    bindColorPicker('btnBgColor', 'swatchBtnBg', '#05344E');

    initAdminGuard(() => {
      fbDb.ref('siteConfig/layout').on('value', (snap) => {
        const l = snap.val() || {};
        document.getElementById('showSectionBannerToggle').checked = l.showSectionBanner !== false;
        if (l.sectionTitle) document.getElementById('sectionTitle').value = l.sectionTitle;
        if (l.sectionSubtitle) document.getElementById('sectionSubtitle').value = l.sectionSubtitle;
        if (l.sectionFontFamily) {
          document.getElementById('sectionFontSelect').value = l.sectionFontFamily;
          document.getElementById('sectionFontPreview').style.fontFamily = l.sectionFontFamily;
        }
        if (l.sectionSize) document.getElementById('sectionSizeSelect').value = l.sectionSize;
        if (l.sectionTextColor) {
          document.getElementById('sectionTextColor').value = l.sectionTextColor;
          document.getElementById('swatchSectionText').style.backgroundColor = l.sectionTextColor;
        }
        if (l.gridCols) document.getElementById('gridColsSelect').value = String(l.gridCols);
        if (l.headerSize) document.getElementById('headerSizeSelect').value = l.headerSize;
        if (l.featuredHeight) document.getElementById('featuredHeightSelect').value = l.featuredHeight;
        if (l.cardHeight) document.getElementById('cardHeightSelect').value = l.cardHeight;
        if (l.btnFontFamily) {
          document.getElementById('btnFontSelect').value = l.btnFontFamily;
          document.getElementById('btnFontPreview').style.fontFamily = l.btnFontFamily;
        }
        if (l.btnFontSize) document.getElementById('btnFontSizeSelect').value = l.btnFontSize;
        if (l.btnTextColor) {
          document.getElementById('btnTextColor').value = l.btnTextColor;
          document.getElementById('swatchBtnText').style.backgroundColor = l.btnTextColor;
        }
        if (l.btnBgColor) {
          document.getElementById('btnBgColor').value = l.btnBgColor;
          document.getElementById('swatchBtnBg').style.backgroundColor = l.btnBgColor;
        }
      });
    });

    document.getElementById('saveLayoutBtn').addEventListener('click', async () => {
      const payload = {
        showSectionBanner: document.getElementById('showSectionBannerToggle').checked,
        sectionTitle: document.getElementById('sectionTitle').value.trim() || 'प्रमुख मंदिरांचे लाईव्ह दर्शन',
        sectionSubtitle: document.getElementById('sectionSubtitle').value.trim() || 'खालीलपैकी कोणत्याही मंदिराच्या फोटोवर टॅप करून मोठ्या स्क्रीनवर अखंड दर्शन घ्या.',
        sectionFontFamily: document.getElementById('sectionFontSelect').value,
        sectionSize: document.getElementById('sectionSizeSelect').value,
        sectionTextColor: document.getElementById('sectionTextColor').value.trim(),
        gridCols: document.getElementById('gridColsSelect').value,
        headerSize: document.getElementById('headerSizeSelect').value,
        featuredHeight: document.getElementById('featuredHeightSelect').value,
        cardHeight: document.getElementById('cardHeightSelect').value,
        btnFontFamily: document.getElementById('btnFontSelect').value,
        btnFontSize: document.getElementById('btnFontSizeSelect').value,
        btnTextColor: document.getElementById('btnTextColor').value.trim(),
        btnBgColor: document.getElementById('btnBgColor').value.trim()
      };
      try {
        await fbDb.ref('siteConfig/layout').update(payload);
        showToast('✅ लेआउट व बटण सेटिंग्ज सेव्ह झाल्या!');
      } catch (err) {
        showToast('❌ त्रुटी: ' + err.message, true);
      }
    });
  </script>
</body>
</html>
