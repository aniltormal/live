<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>प्लेयर, टिकर व वॉटरमार्क — लाईव्ह दर्शन अ‍ॅडमिन</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@400;600;700&family=Amiko:wght@400;600;700&family=Amita:wght@400;700&family=Anek+Devanagari:wght@400;600;700&family=Arya:wght@400;700&family=Asar&family=Bakbak+One&family=Baloo+2:wght@500;600;700&family=Biryani:wght@400;600;700&family=Cambay:wght@400;700&family=Dekko&family=Eczar:wght@400;600;700&family=Glegoo:wght@400;700&family=Gotu&family=Halant:wght@400;600;700&family=Hind:wght@400;600;700&family=Inknut+Antiqua:wght@400;600;700&family=Inter:wght@400;600;700&family=Jaldi:wght@400;700&family=Kadwa:wght@400;700&family=Kalam:wght@400;700&family=Karma:wght@400;600;700&family=Khand:wght@500;600;700&family=Khula:wght@400;600;700&family=Kurale&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@500;600;700&family=Martel+Sans:wght@400;600;700&family=Martel:wght@400;600;700&family=Modak&family=Mukta:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Noto+Serif+Devanagari:wght@400;600;700&family=Palanquin+Dark:wght@400;600;700&family=Palanquin:wght@400;600;700&family=Playpen+Sans+Deva:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Pragati+Narrow:wght@400;700&family=Rajdhani:wght@500;600;700&family=Rhodium+Libre&family=Rozha+One&family=Sahitya:wght@400;700&family=Sarala:wght@400;700&family=Sumana:wght@400;700&family=Sura:wght@400;700&family=Teko:wght@500;600;700&family=Tillana:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Tiro+Devanagari+Marathi:ital@0;1&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Vesper+Libre:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header id="adminTopHeader"></header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6">
    <div id="authGateMsg" class="p-6 rounded-2xl bg-white border border-slate-200 text-center text-sm font-semibold text-slate-600 shadow-sm">
      ⏳ अ‍ॅडमिन तपासणी सुरू आहे...
    </div>

    <div id="pageContent" class="hidden space-y-5 fade-in-up">
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <h2 class="text-base sm:text-lg font-extrabold text-[#05344E] pb-2 border-b border-slate-100">📺 चालणारी पट्टी (Ticker) व ऑफलाईन संदेश</h2>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">चालणाऱ्या पट्टीतील मजकूर (Ticker Text)</label>
          <textarea id="tickerText" rows="2" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" placeholder="🙏 भक्तांसाठी अखंड लाईव्ह दर्शन सेवा..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">स्ट्रीम बंद असल्यास दिसणारा संदेश (Offline Message)</label>
          <input id="offlineMessage" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" placeholder="सध्या हे मंदिर लाईव्ह नाही, कृपया थोड्या वेळाने प्रयत्न करा." />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">प्लेयर व टिकर फॉन्ट (५० देवनागरी फॉन्ट्स)</label>
            <select id="playerFontSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"></select>
            <div id="playerFontPreview" class="mt-2 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-[#05344E]">🙏 अखंड हरिनाम सप्ताह व लाईव्ह दर्शन</div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">टिकर पट्टी रंग (Background)</label>
            <div class="flex items-center gap-2">
              <button id="swatchPlayerBg" type="button" class="w-10 h-10 rounded-xl border border-slate-300 shrink-0 cursor-pointer shadow-sm"></button>
              <input id="tickerBgColor" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" value="#05344E" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">टिकर मजकूर रंग</label>
            <div class="flex items-center gap-2">
              <button id="swatchPlayerText" type="button" class="w-10 h-10 rounded-xl border border-slate-300 shrink-0 cursor-pointer shadow-sm"></button>
              <input id="tickerTextColor" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" value="#FFFFFF" />
            </div>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <h2 class="text-base sm:text-lg font-extrabold text-[#05344E] pb-2 border-b border-slate-100">💧 वॉटरमार्क सेटिंग्ज</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">वॉटरमार्क मजकूर</label>
            <input id="watermarkText" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" placeholder="Anil Tormal" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">वॉटरमार्क रंग</label>
            <div class="flex items-center gap-2">
              <button id="swatchWatermark" type="button" class="w-10 h-10 rounded-xl border border-slate-300 shrink-0 cursor-pointer shadow-sm"></button>
              <input id="watermarkColor" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" value="#FFFFFF" />
            </div>
          </div>
          <div class="sm:col-span-2">
            <div class="flex items-center justify-between text-xs font-bold text-slate-700 mb-1">
              <span>वॉटरमार्क पारदर्शकता (Opacity)</span>
              <span id="watermarkOpacityVal" class="px-2 py-0.5 rounded-md bg-slate-100 text-[#05344E]">40%</span>
            </div>
            <input id="watermarkOpacity" type="range" min="0.05" max="1" step="0.05" value="0.4" class="w-full accent-[#05344E] cursor-pointer" />
          </div>
        </div>
      </section>

      <div class="sticky bottom-3 z-20 flex justify-end">
        <button id="savePlayerBtn" type="button" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-gradient-to-r from-[#05344E] to-[#0a4d70] hover:opacity-95 text-white text-sm font-bold cursor-pointer shadow-lg transition">💾 प्लेयर सेटिंग्ज सेव्ह करा</button>
      </div>
    </div>
  </main>

  <div id="toastBox" class="hidden"></div>

  <script src="admin-common.js"></script>
  <script>
    renderAdminShell('player', 'प्लेयर, टिकर व वॉटरमार्क');
    populateFontSelect('playerFontSelect', 'playerFontPreview');
    bindColorPicker('tickerBgColor', 'swatchPlayerBg', '#05344E');
    bindColorPicker('tickerTextColor', 'swatchPlayerText', '#FFFFFF');
    bindColorPicker('watermarkColor', 'swatchWatermark', '#FFFFFF');

    const opSlider = document.getElementById('watermarkOpacity');
    const opVal = document.getElementById('watermarkOpacityVal');
    opSlider.addEventListener('input', () => {
      opVal.textContent = Math.round(Number(opSlider.value) * 100) + '%';
    });

    initAdminGuard(() => {
      fbDb.ref('siteConfig/player').on('value', (snap) => {
        const p = snap.val() || {};
        if (p.tickerText !== undefined) document.getElementById('tickerText').value = p.tickerText;
        if (p.offlineMessage !== undefined) document.getElementById('offlineMessage').value = p.offlineMessage;
        if (p.fontFamily) {
          document.getElementById('playerFontSelect').value = p.fontFamily;
          document.getElementById('playerFontPreview').style.fontFamily = p.fontFamily;
        }
        if (p.tickerBgColor) {
          document.getElementById('tickerBgColor').value = p.tickerBgColor;
          document.getElementById('swatchPlayerBg').style.backgroundColor = p.tickerBgColor;
        }
        if (p.tickerTextColor) {
          document.getElementById('tickerTextColor').value = p.tickerTextColor;
          document.getElementById('swatchPlayerText').style.backgroundColor = p.tickerTextColor;
        }
        if (p.watermarkText !== undefined) document.getElementById('watermarkText').value = p.watermarkText;
        if (p.watermarkColor) {
          document.getElementById('watermarkColor').value = p.watermarkColor;
          document.getElementById('swatchWatermark').style.backgroundColor = p.watermarkColor;
        }
        if (p.watermarkOpacity !== undefined) {
          opSlider.value = p.watermarkOpacity;
          opVal.textContent = Math.round(Number(p.watermarkOpacity) * 100) + '%';
        }
      });
    });

    document.getElementById('savePlayerBtn').addEventListener('click', async () => {
      const payload = {
        fontFamily: document.getElementById('playerFontSelect').value,
        tickerBgColor: document.getElementById('tickerBgColor').value.trim(),
        tickerTextColor: document.getElementById('tickerTextColor').value.trim(),
        watermarkColor: document.getElementById('watermarkColor').value.trim(),
        watermarkOpacity: Number(opSlider.value)
      };
      const tText = document.getElementById('tickerText').value.trim();
      const offMsg = document.getElementById('offlineMessage').value.trim();
      const wmText = document.getElementById('watermarkText').value.trim();
      if (tText) payload.tickerText = tText;
      if (offMsg) payload.offlineMessage = offMsg;
      if (wmText) payload.watermarkText = wmText;

      try {
        await fbDb.ref('siteConfig/player').update(payload);
        showToast('✅ प्लेयर सेटिंग्ज सेव्ह झाल्या!');
      } catch (err) {
        showToast('❌ त्रुटी: ' + err.message, true);
      }
    });
  </script>
</body>
</html>
