<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>मंदिरे व्यवस्थापन — लाईव्ह दर्शन अ‍ॅडमिन</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header id="adminTopHeader"></header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6">
    <div id="authGateMsg" class="p-6 rounded-2xl bg-white border border-slate-200 text-center text-sm font-semibold text-slate-600 shadow-sm">
      ⏳ अ‍ॅडमिन तपासणी सुरू आहे...
    </div>

    <div id="pageContent" class="hidden space-y-5 fade-in-up">
      <!-- नवीन मंदिर जोडा -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <div class="flex items-center justify-between gap-2">
          <div>
            <h2 class="text-base sm:text-lg font-extrabold text-[#05344E]">➕ नवीन मंदिर जोडा</h2>
            <p class="text-xs text-slate-500">मंदिराचे नाव, लाईव्ह स्ट्रीम प्रकार, लिंक व फोटो अपलोड करा</p>
          </div>
          <button id="toggleAddBtn" type="button" class="px-3.5 py-2 rounded-xl bg-[#05344E] text-white text-xs font-bold cursor-pointer hover:opacity-90 transition">+ नवीन फॉर्म</button>
        </div>

        <form id="addTempleForm" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-3 border-t border-slate-100">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">मंदिराचे नाव *</label>
            <input id="newTempleName" type="text" required placeholder="उदा. श्री सिद्धेश्वर मंदिर" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-[#05344E]" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">स्ट्रीम प्रकार</label>
            <select id="newTempleType" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:border-[#05344E]">
              <option value="hls">HLS (.m3u8)</option>
              <option value="youtube">YouTube Live</option>
              <option value="facebook">Facebook Live / Video</option>
              <option value="iframe">Iframe / Embed URL</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">लाईव्ह स्ट्रीम लिंक (.m3u8 / YouTube / Facebook / URL) *</label>
            <input id="newTempleUrl" type="url" required placeholder="https://.../live.m3u8" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-[#05344E]" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">मंदिराचा फोटो</label>
            <label class="flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-sky-300 bg-gradient-to-br from-sky-50 to-indigo-50 hover:border-[#05344E] hover:from-sky-100/70 hover:to-indigo-100/70 p-2.5 text-center cursor-pointer transition">
              <span id="newTempleImgLabel" class="text-xs font-extrabold text-[#05344E]">📷 येथून फोटो निवडा / अपलोड करा</span>
              <input id="newTempleImgFile" type="file" accept="image/*" class="hidden" />
            </label>
          </div>
          <div class="flex items-center justify-between bg-slate-50 rounded-xl px-3.5 py-2.5 border border-slate-200">
            <span class="text-xs font-bold text-slate-700">प्रमुख (Featured) मंदिर म्हणून दाखवा</span>
            <label class="toggle-pill"><input id="newTempleFeatured" type="checkbox" /><span class="knob"></span></label>
          </div>
          <div class="sm:col-span-2 flex justify-end">
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold cursor-pointer transition shadow-sm">✅ मंदिर जोडा</button>
          </div>
        </form>
      </section>

      <!-- मंदिरांची यादी -->
      <section class="space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-base sm:text-lg font-extrabold text-[#05344E]">🛕 सर्व मंदिरे (<span id="templeCountLabel">0</span>)</h2>
          <span class="text-xs text-slate-500">नाव सुरक्षित आहे — बदलण्यासाठी '✏️ नाव बदला' दाबा; क्रम बदलण्यासाठी स्लायडर सरकवा</span>
        </div>
        <div id="templesList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>
    </div>
  </main>

  <div id="toastBox" class="hidden"></div>

  <script src="admin-common.js"></script>
  <script>
    renderAdminShell('temples', 'मंदिरे व्यवस्थापन');

    const DEFAULT_TEMPLES = [
      { id: 'pandharpur', shortTitle: 'श्री विठ्ठल रुक्मिणी, पंढरपूर', buttonTitle: 'विठ्ठल रुक्मिणी मंदिर पंढरपूर Live Darshan', streamType: 'hls', streamUrl: 'https://cdn1.itekrfid.com/hls/local/index.m3u8', featured: true, order: 0 },
      { id: 'kolhapur', shortTitle: 'श्री अंबाबाई महालक्ष्मी, कोल्हापूर', buttonTitle: 'श्री करवीर निवासिनी अंबाबाई महालक्ष्मी कोल्हापूर Live Darshan', streamType: 'hls', streamUrl: 'https://s122.ipcamlive.com/streams/7au3lhnveuabdrh7x/stream.m3u8', featured: false, order: 1 },
      { id: 'tuljapur', shortTitle: 'श्री तुळजाभवानी, तुळजापूर', buttonTitle: 'श्री तुळजाभवानी मंदिर तुळजापूर Live Darshan', streamType: 'hls', streamUrl: 'https://cdndp.cdn.jio.com/Tulja_Bhavani/Tulja_Bhavani_600.m3u8?cdt=ld9mx1QCVFS8sqls8x1rug', featured: false, order: 2 },
      { id: 'shirdi', shortTitle: 'श्री साईबाबा, शिर्डी', buttonTitle: 'शिर्डी साईबाबा Live Darshan', streamType: 'hls', streamUrl: 'https://cam.pc.cdn.bitgravity.com/cam/live/feed008/Saibaba/temple/feed/playlist_108k.m3u8', featured: false, order: 3 },
      { id: 'dagdusheth', shortTitle: 'दगडूशेठ गणपती, पुणे', buttonTitle: 'दगडूशेठ गणपती पुणे Live Darshan', streamType: 'hls', streamUrl: 'https://dagdusheth2.shemaroo.com/Dagdusheth_Ganpati/Stream1/chunklist_w1236105352.m3u8', featured: false, order: 4 },
      { id: 'siddhivinayak', shortTitle: 'श्री सिद्धिविनायक, मुंबई', buttonTitle: 'श्री सिद्धिविनायक मंदिर मुंबई Live Darshan', streamType: 'auto', streamUrl: '', featured: false, order: 5 }
    ];

    let currentTemplesCount = DEFAULT_TEMPLES.length;

    document.getElementById('toggleAddBtn').addEventListener('click', () => {
      document.getElementById('addTempleForm').classList.toggle('hidden');
    });

    document.getElementById('newTempleImgFile').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) document.getElementById('newTempleImgLabel').textContent = '✅ निवडलेला फोटो: ' + f.name;
    });

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function mergeTemples(fbData) {
      const data = fbData || {};
      const merged = [];
      const seen = new Set();

      DEFAULT_TEMPLES.forEach((def, idx) => {
        const fb = data[def.id] || {};
        if (fb.deleted) return;
        seen.add(def.id);
        merged.push({
          id: def.id,
          shortTitle: fb.shortTitle || fb.name || def.shortTitle,
          buttonTitle: fb.buttonTitle || def.buttonTitle,
          streamType: fb.streamType || def.streamType,
          streamUrl: (typeof fb.streamUrl === 'string') ? fb.streamUrl : def.streamUrl,
          image: fb.image || '',
          featured: (typeof fb.featured === 'boolean') ? fb.featured : def.featured,
          hidden: !!fb.hidden,
          order: (fb.order !== undefined && fb.order !== null) ? Number(fb.order) : idx
        });
      });

      Object.entries(data).forEach(([id, t]) => {
        if (seen.has(id) || !t || t.deleted) return;
        merged.push({
          id,
          shortTitle: t.shortTitle || t.name || t.buttonTitle || id,
          buttonTitle: t.buttonTitle || ((t.shortTitle || t.name || id) + ' Live Darshan'),
          streamType: t.streamType || 'hls',
          streamUrl: t.streamUrl || '',
          image: t.image || '',
          featured: !!t.featured,
          hidden: !!t.hidden,
          order: (t.order !== undefined && t.order !== null) ? Number(t.order) : 999
        });
      });

      merged.sort((a, b) => a.order - b.order);
      return merged;
    }

    function renderTemples(fbData) {
      const container = document.getElementById('templesList');
      const list = mergeTemples(fbData);
      const total = list.length;
      currentTemplesCount = total;
      document.getElementById('templeCountLabel').textContent = total;

      if (!total) {
        container.innerHTML = '<div class="col-span-full p-6 bg-white rounded-2xl border border-slate-200 text-center text-sm text-slate-500">अद्याप कोणतेही मंदिर जोडलेले नाही.</div>';
        return;
      }

      container.innerHTML = list.map((t, idx) => {
        const pos = idx + 1;
        const stType = t.streamType || 'hls';
        return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3" data-temple-id="${esc(t.id)}" data-orig-name="${esc(t.shortTitle)}">
          <div class="flex items-start gap-3">
            ${t.image
              ? `<img src="${esc(t.image)}" alt="" class="w-16 h-16 rounded-xl object-cover bg-slate-100 border border-slate-200 shrink-0" />`
              : `<div class="w-16 h-16 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-2xl shrink-0">🛕</div>`
            }
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2 flex-wrap">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-2 py-0.5 rounded-full bg-[#05344E]/10 text-[11px] font-extrabold text-[#05344E]">#${pos}</span>
                  ${t.featured ? '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-[10px] font-bold text-amber-800">⭐ प्रमुख</span>' : ''}
                  ${t.hidden ? '<span class="px-2 py-0.5 rounded-full bg-rose-100 text-[10px] font-bold text-rose-700">लपवलेले</span>' : ''}
                </div>
                <button type="button" class="t-edit-name-btn px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-bold text-[#05344E] cursor-pointer">✏️ नाव बदला</button>
              </div>
              <h3 class="t-name-heading font-extrabold text-sm sm:text-base text-[#05344E] mt-1.5 leading-snug">${esc(t.shortTitle)}</h3>
              <input type="text" class="t-name hidden w-full mt-1.5 px-3 py-1.5 rounded-xl border border-slate-300 text-sm font-bold text-[#05344E]" value="${esc(t.shortTitle)}" placeholder="मंदिराचे नाव" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1">प्रकार</label>
              <select class="t-type w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs bg-white font-bold">
                <option value="hls" ${stType === 'hls' ? 'selected' : ''}>HLS (.m3u8)</option>
                <option value="youtube" ${stType === 'youtube' ? 'selected' : ''}>YouTube</option>
                <option value="facebook" ${stType === 'facebook' ? 'selected' : ''}>Facebook</option>
                <option value="iframe" ${stType === 'iframe' ? 'selected' : ''}>Iframe</option>
                <option value="auto" ${stType === 'auto' ? 'selected' : ''}>Auto</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="block text-[11px] font-bold text-slate-500 mb-1">लाईव्ह स्ट्रीम लिंक (.m3u8 / URL)</label>
              <input type="url" class="t-url w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" value="${esc(t.streamUrl)}" placeholder="https://..." />
            </div>
          </div>

          <!-- सोपा क्रम बदल (वर/खाली बटणे + स्लायडर) -->
          <div class="bg-slate-50 rounded-xl border border-slate-200 px-3 py-2.5 space-y-2">
            <div class="flex items-center justify-between gap-2 text-xs font-bold text-slate-700">
              <span>↕️ क्रम बदला</span>
              <div class="flex items-center gap-1.5">
                <button type="button" class="t-move-up px-2.5 py-1 rounded-lg bg-white border border-slate-300 hover:border-[#05344E] text-[11px] font-extrabold text-[#05344E] cursor-pointer disabled:opacity-40" ${idx === 0 ? 'disabled' : ''}>⬆️ वर</button>
                <button type="button" class="t-move-down px-2.5 py-1 rounded-lg bg-white border border-slate-300 hover:border-[#05344E] text-[11px] font-extrabold text-[#05344E] cursor-pointer disabled:opacity-40" ${idx === total - 1 ? 'disabled' : ''}>⬇️ खाली</button>
                <span class="t-order-badge px-2.5 py-1 rounded-full bg-[#05344E] text-white text-[11px] font-extrabold">#${pos}</span>
              </div>
            </div>
            <input type="range" min="1" max="${Math.max(1, total)}" step="1" value="${pos}" class="t-order-slider w-full accent-[#05344E] cursor-pointer" />
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 cursor-pointer">
              <span class="font-bold text-slate-700">⭐ प्रमुख कार्ड</span>
              <span class="toggle-pill"><input type="checkbox" class="t-feat" ${t.featured ? 'checked' : ''} /><span class="knob"></span></span>
            </label>
            <label class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 cursor-pointer">
              <span class="font-bold text-slate-700">🙈 लपवा</span>
              <span class="toggle-pill"><input type="checkbox" class="t-hide" ${t.hidden ? 'checked' : ''} /><span class="knob"></span></span>
            </label>
          </div>

          <div class="pt-2 border-t border-slate-100 space-y-2.5">
            <label class="flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-amber-300 bg-gradient-to-br from-amber-50 to-orange-50 hover:border-amber-500 p-2 text-center cursor-pointer transition">
              <span class="text-xs font-extrabold text-amber-900">📷 फोटो निवडा / बदला</span>
              <input type="file" accept="image/*" class="t-file hidden" />
            </label>
            <div class="flex items-center justify-end gap-2">
              <button type="button" class="t-save px-4 py-2 rounded-xl bg-[#05344E] hover:bg-[#04273b] text-white text-xs font-bold cursor-pointer transition">💾 सेव्ह करा</button>
              <button type="button" class="t-del px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold cursor-pointer transition">🗑️</button>
            </div>
          </div>
        </div>
      `;
      }).join('');

      container.querySelectorAll('[data-temple-id]').forEach((card) => {
        const id = card.dataset.templeId;
        const editBtn = card.querySelector('.t-edit-name-btn');
        const heading = card.querySelector('.t-name-heading');
        const nameInp = card.querySelector('.t-name');
        const slider = card.querySelector('.t-order-slider');
        const badge = card.querySelector('.t-order-badge');

        editBtn.addEventListener('click', () => {
          const isHidden = nameInp.classList.contains('hidden');
          nameInp.classList.toggle('hidden', !isHidden);
          heading.classList.toggle('hidden', isHidden);
          editBtn.textContent = isHidden ? '✅ नाव पक्के करा' : '✏️ नाव बदला';
          if (isHidden) nameInp.focus();
          else heading.textContent = nameInp.value.trim() || card.dataset.origName;
        });

        async function moveTempleToPosition(targetOneBased) {
          const fromIdx = list.findIndex(item => item.id === id);
          const toIdx = Math.max(0, Math.min(list.length - 1, targetOneBased - 1));
          if (fromIdx === -1 || fromIdx === toIdx) return;
          const reordered = list.slice();
          const [moved] = reordered.splice(fromIdx, 1);
          reordered.splice(toIdx, 0, moved);
          const updates = {};
          reordered.forEach((item, newIdx) => {
            updates['temples/' + item.id + '/order'] = newIdx;
          });
          try {
            await fbDb.ref().update(updates);
            showToast(`✅ "${moved.shortTitle}" आता #${toIdx + 1} क्रमांकावर आहे!`);
          } catch (err) {
            showToast('❌ क्रम बदलताना त्रुटी: ' + err.message, true);
          }
        }

        card.querySelector('.t-move-up').addEventListener('click', () => moveTempleToPosition(idx));
        card.querySelector('.t-move-down').addEventListener('click', () => moveTempleToPosition(idx + 2));

        slider.addEventListener('input', () => {
          badge.textContent = '#' + slider.value;
        });
        slider.addEventListener('change', () => {
          moveTempleToPosition(Number(slider.value));
        });

        const tFile = card.querySelector('.t-file');
        if (tFile) {
          tFile.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
              let im = card.querySelector('img');
              if (!im) {
                im = document.createElement('img');
                im.className = 'w-16 h-16 rounded-xl object-cover bg-slate-100 border border-slate-200 shrink-0';
                card.querySelector('.flex.items-start').replaceChild(im, card.querySelector('.flex.items-start > div:first-child'));
              }
              im.src = ev.target.result;
            };
            r.readAsDataURL(f);
          });
        }

        card.querySelector('.t-save').addEventListener('click', async () => {
          const finalName = nameInp.value.trim() || card.dataset.origName;
          const orderNum = Math.max(0, Number(slider.value) - 1);
          const payload = {
            shortTitle: finalName,
            buttonTitle: finalName + ' Live Darshan',
            name: finalName,
            streamType: card.querySelector('.t-type').value,
            streamUrl: card.querySelector('.t-url').value.trim(),
            featured: card.querySelector('.t-feat').checked,
            hidden: card.querySelector('.t-hide').checked,
            order: orderNum
          };
          try {
            if (tFile && tFile.files[0]) {
              payload.image = await compressImageFile(tFile.files[0], 640, 480, 0.82);
            }
            await fbDb.ref('temples/' + id).update(payload);
            showToast('✅ मंदिर अपडेट झाले!');
          } catch (err) {
            showToast('❌ त्रुटी: ' + err.message, true);
          }
        });

        card.querySelector('.t-del').addEventListener('click', async () => {
          if (!confirm('हे मंदिर कायमचे काढून टाकायचे का?')) return;
          try {
            await fbDb.ref('temples/' + id).update({ deleted: true });
            showToast('🗑️ मंदिर काढले');
          } catch (err) {
            showToast('❌ त्रुटी: ' + err.message, true);
          }
        });
      });
    }

    initAdminGuard(() => {
      fbDb.ref('temples').on('value', (snap) => renderTemples(snap.val()));
    });

    document.getElementById('addTempleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('newTempleName').value.trim();
      const streamType = document.getElementById('newTempleType').value;
      const streamUrl = document.getElementById('newTempleUrl').value.trim();
      const featured = document.getElementById('newTempleFeatured').checked;
      const file = document.getElementById('newTempleImgFile').files[0];
      if (!name || !streamUrl) return;
      try {
        const newId = 'custom_' + Date.now();
        const payload = {
          id: newId,
          shortTitle: name,
          buttonTitle: name + ' Live Darshan',
          name,
          streamType,
          streamUrl,
          featured,
          hidden: false,
          order: currentTemplesCount
        };
        if (file) payload.image = await compressImageFile(file, 640, 480, 0.82);
        await fbDb.ref('temples/' + newId).set(payload);
        e.target.reset();
        document.getElementById('newTempleImgLabel').textContent = '📷 येथून फोटो निवडा / अपलोड करा';
        e.target.classList.add('hidden');
        showToast('✅ नवीन मंदिर जोडले!');
      } catch (err) {
        showToast('❌ त्रुटी: ' + err.message, true);
      }
    });
  </script>
</body>
</html>
