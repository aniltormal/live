<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>भाविक काऊंटर व १० लिंक्स — लाईव्ह दर्शन अ‍ॅडमिन</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header id="adminTopHeader"></header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6">
    <div id="authGateMsg" class="p-6 rounded-2xl bg-white border border-slate-200 text-center text-sm font-semibold text-slate-600 shadow-sm">
      ⏳ अ‍ॅडमिन तपासणी सुरू आहे...
    </div>

    <div id="pageContent" class="hidden space-y-5 fade-in-up">
      <!-- भाविक काऊंटर -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-100">
          <h2 class="text-base sm:text-lg font-extrabold text-[#05344E]">👁️ भाविक काऊंटर सेटिंग्ज</h2>
          <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
            <span>काऊंटर दाखवा</span>
            <span class="toggle-pill"><input id="visEnabled" type="checkbox" checked /><span class="knob"></span></span>
          </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">काऊंटर लेबल</label>
            <input id="visLabel" type="text" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" value="एकूण भाविक" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">सध्याची भाविक संख्या</label>
            <input id="visCount" type="number" min="0" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold" value="0" />
          </div>
          <label class="flex items-center justify-between bg-slate-50 px-3.5 py-2.5 rounded-xl border border-slate-200 cursor-pointer">
            <span class="text-xs font-bold text-slate-700">✨ फ्लॅश इफेक्ट</span>
            <span class="toggle-pill"><input id="visFlash" type="checkbox" checked /><span class="knob"></span></span>
          </label>
        </div>
      </section>

      <!-- तळाच्या १० लिंक्स -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-100">
          <div>
            <h2 class="text-base sm:text-lg font-extrabold text-[#05344E]">🔗 तळाच्या लिंक्स (Legal & Info Links)</h2>
            <p class="text-xs text-slate-500">मुख्य पेजच्या फुटरवर दिसणाऱ्या लिंक्स</p>
          </div>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
              <span>पट्टी दाखवा</span>
              <span class="toggle-pill"><input id="linksEnabled" type="checkbox" checked /><span class="knob"></span></span>
            </label>
            <button id="addLinkBtn" type="button" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-[#05344E] cursor-pointer">+ लिंक जोडा</button>
          </div>
        </div>

        <div id="linksContainer" class="space-y-2.5"></div>
      </section>

      <div class="sticky bottom-3 z-20 flex justify-end">
        <button id="saveVisLinksBtn" type="button" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-gradient-to-r from-[#05344E] to-[#0a4d70] hover:opacity-95 text-white text-sm font-bold cursor-pointer shadow-lg transition">💾 भाविक व लिंक्स सेव्ह करा</button>
      </div>
    </div>
  </main>

  <div id="toastBox" class="hidden"></div>

  <script src="admin-common.js"></script>
  <script>
    renderAdminShell('visitors', 'भाविक काऊंटर व १० लिंक्स');

    const DEFAULT_LINKS = [
      { label: 'आमच्याबद्दल', url: 'about.html', enabled: true },
      { label: 'संपर्क', url: 'contact.html', enabled: true },
      { label: 'जाहिरात', url: 'advertising.html', enabled: true },
      { label: 'गोपनीयता', url: 'privacy.html', enabled: true },
      { label: 'अटी', url: 'terms.html', enabled: true },
      { label: 'अस्वीकरण', url: 'disclaimer.html', enabled: true },
      { label: 'कुकीज', url: 'cookies.html', enabled: true },
      { label: 'कॉपीराइट', url: 'copyright.html', enabled: true },
      { label: 'मजकूर काढणे', url: 'content-removal.html', enabled: true },
      { label: 'बाह्य लिंक्स', url: 'third-party-links.html', enabled: true }
    ];

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderLinks(items) {
      const box = document.getElementById('linksContainer');
      box.innerHTML = (items || []).map((it, idx) => `
        <div class="link-row grid grid-cols-12 gap-2 items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <div class="col-span-2 sm:col-span-1 flex justify-center">
            <label class="toggle-pill"><input type="checkbox" class="l-en" ${it.enabled !== false ? 'checked' : ''} /><span class="knob"></span></label>
          </div>
          <input type="text" class="l-lbl col-span-5 sm:col-span-4 px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold bg-white" value="${esc(it.label)}" placeholder="नाव" />
          <input type="text" class="l-url col-span-4 sm:col-span-6 px-3 py-2 rounded-lg border border-slate-300 text-xs font-mono bg-white" value="${esc(it.url)}" placeholder="page.html" />
          <button type="button" class="l-del col-span-1 text-center text-rose-600 font-bold text-sm hover:bg-rose-50 py-1.5 rounded-lg cursor-pointer" title="काढा">✕</button>
        </div>
      `).join('');

      box.querySelectorAll('.l-del').forEach((btn) => {
        btn.addEventListener('click', () => btn.closest('.link-row').remove());
      });
    }

    document.getElementById('addLinkBtn').addEventListener('click', () => {
      const rows = Array.from(document.querySelectorAll('#linksContainer .link-row')).map(r => ({
        enabled: r.querySelector('.l-en').checked,
        label: r.querySelector('.l-lbl').value,
        url: r.querySelector('.l-url').value
      }));
      rows.push({ label: 'नवीन लिंक', url: 'page.html', enabled: true });
      renderLinks(rows);
    });

    initAdminGuard(() => {
      fbDb.ref('siteConfig/visitors').on('value', (snap) => {
        const v = snap.val() || {};
        document.getElementById('visEnabled').checked = v.enabled !== false;
        if (v.label) document.getElementById('visLabel').value = v.label;
        if (v.count !== undefined) document.getElementById('visCount').value = v.count;
        document.getElementById('visFlash').checked = v.flash !== false;
      });

      fbDb.ref('siteConfig/legalLinks').on('value', (snap) => {
        const l = snap.val() || {};
        document.getElementById('linksEnabled').checked = l.enabled !== false;
        renderLinks(Array.isArray(l.items) && l.items.length ? l.items : DEFAULT_LINKS);
      });
    });

    document.getElementById('saveVisLinksBtn').addEventListener('click', async () => {
      const items = [];
      document.querySelectorAll('#linksContainer .link-row').forEach((r) => {
        const label = r.querySelector('.l-lbl').value.trim();
        const url = r.querySelector('.l-url').value.trim();
        const enabled = r.querySelector('.l-en').checked;
        if (label && url) items.push({ label, url, enabled });
      });

      try {
        await fbDb.ref('siteConfig/visitors').set({
          enabled: document.getElementById('visEnabled').checked,
          label: document.getElementById('visLabel').value.trim() || 'एकूण भाविक',
          count: Math.max(0, Number(document.getElementById('visCount').value) || 0),
          flash: document.getElementById('visFlash').checked
        });
        await fbDb.ref('siteConfig/legalLinks').set({
          enabled: document.getElementById('linksEnabled').checked,
          items
        });
        showToast('✅ भाविक काऊंटर व लिंक्स सेव्ह झाल्या!');
      } catch (err) {
        showToast('❌ त्रुटी: ' + err.message, true);
      }
    });
  </script>
</body>
</html>
