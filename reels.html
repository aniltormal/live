<head>

  <title>🎬 दर्शन शॉर्ट्स — दर्शन सेतू लाईव्ह</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: 'Noto Sans Devanagari', sans-serif; overflow: hidden; }
    .app-shell { position: relative; width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; background: #050a12; overflow: hidden; }
    .feed { height: calc(100% - 66px); overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; transition: height 0.25s ease; }
    .feed::-webkit-scrollbar { display: none; }
    .app-shell.cmt-open .feed { height: 100%; }
    .reel { position: relative; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: #000; }
    .reel-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kbZoom 12s ease-in-out infinite alternate; }
    @keyframes kbZoom { 0% { transform: scale(1); } 100% { transform: scale(1.07); } }
    .reel-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 22%, transparent 56%, rgba(0,0,0,0.86) 100%); pointer-events: none; }
    .top-bar { position: absolute; top: 8px; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: center; pointer-events: none; padding: 0 12px; }
    .reels-logo { height: 42px; width: auto; max-width: 66%; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8)); }
    .mute-btn { position: absolute; right: 12px; top: 4px; width: 34px; height: 34px; border-radius: 50%; background: rgba(7,19,32,0.72); border: 1px solid rgba(251,191,36,0.55); color: #FCD34D; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; pointer-events: auto; backdrop-filter: blur(8px); }
    .admin-pill { position: absolute; left: 10px; top: 6px; z-index: 35; padding: 4px 10px; border-radius: 999px; background: rgba(5,52,78,0.9); border: 1px solid #FCD34D; color: #FCD34D; font-size: 11px; font-weight: 800; cursor: pointer; pointer-events: auto; display: flex; align-items: center; gap: 4px; }
    .bottom-left { position: absolute; left: 14px; right: 98px; bottom: 18px; z-index: 20; display: flex; flex-direction: column; gap: 6px; }
    .actions { position: absolute; right: 8px; width: 64px; bottom: 88px; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .act-btn { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.85)); }
    .act-lbl { font-size: 11px; font-weight: 700; color: #f8fafc; }
    .petal-burst { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 56px; animation: petalPop 0.75s ease forwards; z-index: 25; }
    @keyframes petalPop { 0% { opacity: 0; transform: scale(0.4); } 40% { opacity: 1; transform: scale(1.25); } 100% { opacity: 0; transform: scale(1.6) translateY(-28px); } }
    .bnav { position: absolute; bottom: 0; left: 0; right: 0; height: 66px; background: #071320; border-top: 1px solid rgba(251,191,36,0.28); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 32; }
    .bnav-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #94a3b8; font-size: 11px; font-weight: 700; text-decoration: none; cursor: pointer; background: transparent; border: none; }
    .bnav-item.active { color: #FCD34D; }
    .bnav-item.active::before { content: ''; position: absolute; top: 0; left: 18%; right: 18%; height: 3px; border-radius: 0 0 6px 6px; background: linear-gradient(90deg, #F59E0B, #FDE68A, #F59E0B); box-shadow: 0 2px 10px rgba(251,191,36,0.85); }
    .dark-shimmer { background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%); background-size: 200% 100%; animation: sh 1.3s infinite; }
    @keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sheet { position: absolute; inset: 0; z-index: 45; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: flex; align-items: flex-end; }
    .sheet-card { width: 100%; background: #0b1624; color: #fff; border-top: 2px solid rgba(251,191,36,0.5); border-radius: 24px 24px 0 0; max-height: 70dvh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
  </style>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCI1oILspru4DCLuUQvNohtKArFVVMy4Xc',
      authDomain: 'livedarshan-204ed.firebaseapp.com',
      databaseURL: 'https://livedarshan-204ed-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'livedarshan-204ed',
      storageBucket: 'livedarshan-204ed.firebasestorage.app',
      messagingSenderId: '76847755872',
      appId: '1:76847755872:web:5de22983493926bb8bc905'
    };
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const fbAuth = firebase.auth();
    const fbDb = firebase.database();

    const optImg = (u) => {
      if (!u || typeof u !== 'string') return 'icon-192.png';
      if (u.includes('res.cloudinary.com') && u.includes('/image/upload/') && !u.includes('f_auto')) {
        return u.replace('/image/upload/', '/image/upload/f_auto,q_auto,w_800/');
      }
      return u;
    };

    let currentUser = null;
    let userProfile = null;
    let isAdminUser = false;
    let shortsCfg = {};
    let templesMap = {};
    let reelsList = [];
    let currentReelIdx = 0;
    let isMuted = true;
    let activeCmtReel = null;
    let hlsInstance = null;
    let autoScrollTimer = null;
    const urlParams = new URLSearchParams(location.search);

    async function getCachedOrFetch(key, refPath, ttlMs = 600000) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Date.now() - parsed.ts < ttlMs) return parsed.data;
        }
      } catch(_) {}
      const snap = await fbDb.ref(refPath).once('value');
      const data = snap.val() || {};
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch(_) {}
      return data;
    }

    async function boot() {
      const [cfgData, tData, ddSnap] = await Promise.all([
        getCachedOrFetch('ds_shorts_cfg_v1', 'siteConfig/shortsConfig', 300000),
        getCachedOrFetch('ds_temples_v1', 'temples', 600000),
        fbDb.ref('dailyDarshan/latest').once('value')
      ]);
      shortsCfg = cfgData || {};
      templesMap = tData || {};
      if (shortsCfg.ui && shortsCfg.ui.customLogoUrl) {
        document.getElementById('reelsLogoImg').src = shortsCfg.ui.customLogoUrl;
      }

      const latest = ddSnap.val() || {};
      buildReelsFeed(latest);

      fbAuth.onAuthStateChanged(async (user) => {
        currentUser = user;
        if (user) {
          const uSnap = await fbDb.ref(`shortsUsers/${user.uid}`).once('value');
          userProfile = uSnap.val();
          if (userProfile && userProfile.photoURL) document.getElementById('navAvatar').src = userProfile.photoURL;
          // Check admin status (either admin.html auth without shortsUsers or role==='admin' or ?admin=1 with auth)
          const admSnap = await fbDb.ref(`shortsAdmins/${user.uid}`).once('value');
          isAdminUser = !!admSnap.val() || (userProfile && userProfile.role === 'admin') || (!userProfile && !!user.email) || urlParams.get('admin') === '1';
          document.getElementById('adminModePill').classList.toggle('hidden', !isAdminUser);
        }
      });
    }

    function buildReelsFeed(latestObj) {
      const hiddenIds = (shortsCfg.feed && shortsCfg.feed.hiddenReelIds) || {};
      const syncHidden = !shortsCfg.feed || shortsCfg.feed.syncHiddenTemples !== false;
      const filterTemple = urlParams.get('temple');
      const filterReel = urlParams.get('reel');

      let items = [];
      Object.entries(latestObj).forEach(([tid, data]) => {
        const tInfo = templesMap[tid] || {};
        if (syncHidden && tInfo.visible === false) return;
        const photos = Array.isArray(data.photos) ? data.photos : (data.image ? [data.image] : (data.url ? [data.url] : []));
        photos.forEach((pUrl, idx) => {
          const rid = `${tid}_${idx}`;
          if (hiddenIds[rid]) return;
          if (filterTemple && tid !== filterTemple) return;
          items.push({
            id: rid,
            templeId: tid,
            templeName: tInfo.name || tInfo.title || data.templeName || tid,
            templeImg: optImg(tInfo.image || tInfo.photo || pUrl),
            mediaUrl: optImg(pUrl),
            date: data.date || 'आजचे दर्शन',
            liveUrl: tInfo.liveUrl || tInfo.streamUrl || tInfo.url || '',
            liveType: tInfo.type || tInfo.streamType || '',
            ts: data.updatedAt || Date.now()
          });
        });
      });

      // Fallback if latest is empty
      if (!items.length) {
        Object.entries(templesMap).forEach(([tid, t]) => {
          if (syncHidden && t.visible === false) return;
          items.push({
            id: `${tid}_0`,
            templeId: tid,
            templeName: t.name || t.title || tid,
            templeImg: optImg(t.image || t.photo || 'icon-192.png'),
            mediaUrl: optImg(t.image || t.photo || 'icon-192.png'),
            date: 'आजचे मंगल दर्शन',
            liveUrl: t.liveUrl || t.streamUrl || t.url || '',
            liveType: t.type || t.streamType || '',
            ts: Date.now()
          });
        });
      }

      if (shortsCfg.feed && shortsCfg.feed.smartShuffle && !filterReel) {
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
      }
      if (filterReel) {
        const idx = items.findIndex(x => x.id === filterReel);
        if (idx > 0) { const [picked] = items.splice(idx, 1); items.unshift(picked); }
      }

      // Inject In-Feed Ads if enabled
      const adsCfg = shortsCfg.ads || {};
      const activeAds = (adsCfg.items || []).filter(a => a.active !== false);
      if (adsCfg.enabled && activeAds.length) {
        const everyN = adsCfg.afterEveryN || 4;
        const merged = [];
        items.forEach((it, idx) => {
          merged.push(it);
          if ((idx + 1) % everyN === 0) {
            const ad = activeAds[Math.floor(idx / everyN) % activeAds.length];
            merged.push({ isAd: true, ...ad });
          }
        });
        items = merged;
      }

      reelsList = items;
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('reelsFeed');
      const showLive = !shortsCfg.ui || shortsCfg.ui.showLiveBtn !== false;
      const followedMap = (userProfile && userProfile.followedTemples) || {};

      feed.innerHTML = reelsList.map((r, i) => {
        if (r.isAd) {
          return `<div class="reel flex items-center justify-center bg-gradient-to-br from-[#031926] to-[#084160] p-6" data-idx="${i}">
            <div class="w-full rounded-3xl bg-white/10 border border-amber-400/50 p-5 text-center space-y-3 backdrop-blur">
              <span class="px-2.5 py-0.5 rounded-full bg-amber-400 text-[#031926] text-[10px] font-extrabold">प्रायोजित</span>
              ${r.mediaUrl ? `<img src="${optImg(r.mediaUrl)}" class="w-full h-56 object-cover rounded-2xl"/>` : ''}
              <h3 class="text-lg font-extrabold text-amber-200">${r.title}</h3>
              <a href="${r.ctaUrl}" target="_blank" class="inline-block w-full py-3 rounded-2xl bg-amber-400 text-[#031926] font-extrabold text-sm">${r.ctaText || 'अधिक पहा →'}</a>
            </div>
          </div>`;
        }
        const isFol = !!followedMap[r.templeId];
        return `<div class="reel" data-idx="${i}" data-rid="${r.id}">
          <img src="${r.mediaUrl}" loading="lazy" alt="${r.templeName}" class="reel-bg" />
          <div class="reel-grad"></div>

          <div class="bottom-left">
            <div class="flex items-center gap-2">
              <img src="${r.templeImg}" class="w-9 h-9 rounded-full object-cover border-2 border-amber-400 shrink-0"/>
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1">
                  <span class="font-extrabold text-sm text-white truncate">${r.templeName}</span>
                  <button type="button" onclick="showVerifiedPopup()" class="shrink-0" title="व्हेरिफाइड">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 1.5l2.2 1.9 2.9-.4 1.1 2.7 2.7 1.1-.4 2.9 1.9 2.3-1.9 2.3.4 2.9-2.7 1.1-1.1 2.7-2.9-.4-2.2 1.9-2.2-1.9-2.9.4-1.1-2.7-2.7-1.1.4-2.9-1.9-2.3 1.9-2.3-.4-2.9 2.7-1.1 1.1-2.7 2.9.4L12 1.5z" fill="#F59E0B"/><path d="M8.5 12.3l2.3 2.3 4.8-5" stroke="#031926" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                </div>
                <div class="text-[11px] text-amber-200 font-bold">📅 ${r.date}</div>
              </div>
              <button type="button" onclick="toggleFollow(this,'${r.templeId}')" class="px-2.5 py-1 rounded-full text-[11px] font-extrabold border ${isFol ? 'bg-white/20 border-white/40 text-white' : 'bg-amber-400 border-amber-300 text-[#031926]'}">${isFol ? '✓ फॉलो केले' : '+ फॉलो'}</button>
            </div>
            ${showLive && r.liveUrl ? `<button type="button" onclick="openLivePopup(${i})" class="self-start px-3.5 py-1.5 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold shadow-lg flex items-center gap-1.5"><span>🔴</span><span>LIVE Darshan घ्या</span></button>` : ''}
          </div>

          <div class="actions">
            <button type="button" onclick="toggleLike(this, ${i})" class="act-btn">
              <span class="text-2xl">🤍</span>
              <span class="act-lbl">लाईक</span>
            </button>
            <button type="button" onclick="openComments(${i})" class="act-btn">
              <span class="text-2xl">💬</span>
              <span class="act-lbl">कमेंट्स</span>
            </button>
            <button type="button" onclick="toggleSave(this, ${i})" class="act-btn">
              <span class="text-2xl">🔖</span>
              <span class="act-lbl">सेव्ह</span>
            </button>
            <button type="button" onclick="shareReel(${i})" class="act-btn">
              <span class="text-2xl">📤</span>
              <span class="act-lbl">शेअर</span>
            </button>
            <button type="button" onclick="openMore(${i})" class="act-btn">
              <span class="text-xl font-extrabold">⋮</span>
            </button>
          </div>
        </div>`;
      }).join('');

      document.getElementById('reelsSkel').classList.add('hidden');
      setupObserver();
    }

    function setupObserver() {
      const feed = document.getElementById('reelsFeed');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (en.isIntersecting) {
            currentReelIdx = Number(en.target.dataset.idx) || 0;
            playReelAudio(reelsList[currentReelIdx]);
            scheduleAutoScroll();
          }
        });
      }, { root: feed, threshold: 0.7 });
      feed.querySelectorAll('.reel').forEach(el => obs.observe(el));
    }

    function playReelAudio(r) {
      const audio = document.getElementById('bgAudio');
      if (!r || r.isAd) { audio.pause(); return; }
      const tracks = (shortsCfg.audio && shortsCfg.audio.templeTracks && shortsCfg.audio.templeTracks[r.templeId]) || [];
      if (!tracks.length) { audio.pause(); return; }
      const pick = (shortsCfg.audio.randomAudio !== false) ? tracks[Math.floor(Math.random() * tracks.length)] : tracks[0];
      if (pick && pick.url && audio.src !== pick.url) {
        audio.src = pick.url;
        audio.muted = isMuted;
        audio.play().catch(() => {});
      }
    }

    function scheduleAutoScroll() {
      if (autoScrollTimer) clearTimeout(autoScrollTimer);
      if (shortsCfg.audio && shortsCfg.audio.autoScroll) {
        const sec = (shortsCfg.audio.durationSec || 10) * 1000;
        autoScrollTimer = setTimeout(() => {
          const feed = document.getElementById('reelsFeed');
          const next = feed.querySelector(`.reel[data-idx="${currentReelIdx + 1}"]`);
          if (next) next.scrollIntoView({ behavior: 'smooth' });
        }, sec);
      }
    }

    document.getElementById('muteBtn').onclick = () => {
      isMuted = !isMuted;
      const audio = document.getElementById('bgAudio');
      audio.muted = isMuted;
      if (!isMuted) audio.play().catch(() => {});
      document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
    };

    window.showVerifiedPopup = () => {
      const p = document.getElementById('badgePopup');
      p.textContent = '✓ ' + ((shortsCfg.ui && shortsCfg.ui.badgeText) || 'दर्शनसेतू .लाईव्ह व्हेरिफाइड');
      p.classList.remove('hidden');
      setTimeout(() => p.classList.add('hidden'), 2500);
    };

    function requireLogin() {
      if (!currentUser) {
        if (confirm('या सुविधेसाठी कृपया भक्ती प्रोफाइल लॉगिन करा. प्रोफाइल पानावर जायचे का?')) {
          location.href = 'profile.html';
        }
        return false;
      }
      return true;
    }

    window.toggleLike = async (btn, idx) => {
      if (!requireLogin()) return;
      const r = reelsList[idx];
      const iconEl = btn.querySelector('span');
      const liked = iconEl.textContent === '❤️';
      iconEl.textContent = liked ? '🤍' : '❤️';
      if (!liked) {
        const b = document.createElement('div');
        b.className = 'petal-burst';
        b.textContent = '🌸🙏🌸';
        btn.closest('.reel').appendChild(b);
        setTimeout(() => b.remove(), 750);
        await fbDb.ref(`shortsUserLikes/${currentUser.uid}/${r.id}`).set({ thumb: r.mediaUrl, templeName: r.templeName, ts: Date.now() });
      } else {
        await fbDb.ref(`shortsUserLikes/${currentUser.uid}/${r.id}`).remove();
      }
    };

    window.toggleSave = async (btn, idx) => {
      if (!requireLogin()) return;
      const r = reelsList[idx];
      const lbl = btn.querySelector('.act-lbl');
      const saved = lbl.textContent === 'सेव्ह केले';
      lbl.textContent = saved ? 'सेव्ह' : 'सेव्ह केले';
      if (!saved) {
        await fbDb.ref(`shortsUserSaved/${currentUser.uid}/${r.id}`).set({ thumb: r.mediaUrl, templeName: r.templeName, ts: Date.now() });
      } else {
        await fbDb.ref(`shortsUserSaved/${currentUser.uid}/${r.id}`).remove();
      }
    };

    window.toggleFollow = async (btn, tid) => {
      if (!requireLogin()) return;
      const isFol = btn.textContent.includes('फॉलो केले');
      if (isFol) {
        await fbDb.ref(`shortsUsers/${currentUser.uid}/followedTemples/${tid}`).remove();
        btn.textContent = '+ फॉलो';
        btn.className = 'px-2.5 py-1 rounded-full text-[11px] font-extrabold border bg-amber-400 border-amber-300 text-[#031926]';
      } else {
        await fbDb.ref(`shortsUsers/${currentUser.uid}/followedTemples/${tid}`).set(true);
        btn.textContent = '✓ फॉलो केले';
        btn.className = 'px-2.5 py-1 rounded-full text-[11px] font-extrabold border bg-white/20 border-white/40 text-white';
      }
    };

    window.shareReel = (idx) => {
      const r = reelsList[idx];
      const url = `${location.origin}${location.pathname}?reel=${r.id}`;
      const txt = `🙏 ${r.templeName}चे मंगल दर्शन पहा: ${url}`;
      if (navigator.share) navigator.share({ title: r.templeName, text: txt, url });
      else window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
    };

    // Split-View Comments
    window.openComments = async (idx) => {
      activeCmtReel = reelsList[idx];
      document.getElementById('appShell').classList.add('cmt-open');
      document.getElementById('cmtSheet').classList.remove('hidden');
      const presets = (shortsCfg.ui && shortsCfg.ui.presetComments) || ['🙏 जय हरी विठ्ठल!', '🌸 सुंदर दर्शन!'];
      document.getElementById('presetCmtChips').innerHTML = presets.map(p => `<button type="button" onclick="usePresetCmt('${p.replace(/'/g,'')}')" class="shrink-0 px-2.5 py-1 rounded-full bg-slate-800 border border-amber-400/40 text-amber-200 text-[11px] font-bold">${p}</button>`).join('');
      await loadCommentsForReel(activeCmtReel.id);
    };
    window.usePresetCmt = (txt) => { document.getElementById('cmtInput').value = txt; };
    document.getElementById('closeCmtBtn').onclick = () => {
      document.getElementById('cmtSheet').classList.add('hidden');
      document.getElementById('appShell').classList.remove('cmt-open');
    };

    async function loadCommentsForReel(rid) {
      const box = document.getElementById('cmtList');
      box.innerHTML = '<div class="text-slate-400 text-center py-4">कमेंट्स लोड होत आहेत...</div>';
      const snap = await fbDb.ref(`shortsComments/${rid}`).limitToLast(25).once('value');
      const entries = Object.entries(snap.val() || {}).sort((a, b) => (b[1].pinned ? 1 : 0) - (a[1].pinned ? 1 : 0) || (b[1].createdAt - a[1].createdAt));
      if (!entries.length) { box.innerHTML = '<div class="text-slate-400 text-center py-4">पहिली भक्तीमय कमेंट करा 🙏</div>'; return; }
      box.innerHTML = entries.map(([cid, c]) => `
        <div class="p-2.5 rounded-xl ${c.isAdminReply ? 'bg-amber-950/60 border border-amber-400/60' : 'bg-slate-900 border border-slate-800'} space-y-1">
          <div class="flex items-center justify-between gap-2">
            <button type="button" onclick="onCommentUserTap('${c.uid || ''}','${(c.userName || 'भक्त').replace(/'/g,'')}','${cid}')" class="font-extrabold ${c.isAdminReply ? 'text-amber-300' : 'text-sky-300'} text-left">${c.isAdminReply ? '🛡️ दर्शन सेतू .लाईव्ह टीम ✓' : (c.userName || 'भक्त') + ' ✓'}</button>
            ${c.pinned ? '<span class="text-[10px] text-amber-400 font-bold">📌 पिन</span>' : ''}
          </div>
          <div class="text-slate-100">${c.text}</div>
          ${isAdminUser ? `<div class="flex gap-2 pt-1 text-[10px]">
            <button type="button" onclick="adminPinCmt('${rid}','${cid}',${!c.pinned})" class="text-amber-300 font-bold">${c.pinned ? 'अनपिन' : '📌 पिन'}</button>
            <button type="button" onclick="adminDelCmt('${rid}','${cid}')" class="text-rose-400 font-bold">🗑️ हटवा</button>
          </div>` : ''}
        </div>`).join('');
    }

    document.getElementById('sendCmtBtn').onclick = async () => {
      if (!requireLogin() || !activeCmtReel) return;
      if (userProfile && userProfile.blocked) return alert('तुमचे खाते तात्पुरते ब्लॉक आहे.');
      const txt = document.getElementById('cmtInput').value.trim();
      if (!txt) return;
      const banned = (shortsCfg.moderation && shortsCfg.moderation.bannedWords) || [];
      if (banned.some(w => w && txt.toLowerCase().includes(w.toLowerCase()))) {
        return alert('कृपया मर्यादित व भक्तीमय भाषेतच कमेंट लिहा.');
      }
      const payload = {
        uid: currentUser.uid,
        userName: isAdminUser ? 'दर्शन सेतू .लाईव्ह टीम' : ((userProfile && userProfile.name) || 'भक्त'),
        isAdminReply: !!isAdminUser,
        text: txt,
        pinned: false,
        createdAt: Date.now()
      };
      await fbDb.ref(`shortsComments/${activeCmtReel.id}`).push(payload);
      if (!isAdminUser) {
        await fbDb.ref(`shortsUserComments/${currentUser.uid}`).push({ reelId: activeCmtReel.id, reelTitle: activeCmtReel.templeName, text: txt, createdAt: Date.now() });
      }
      document.getElementById('cmtInput').value = '';
      loadCommentsForReel(activeCmtReel.id);
    };

    // Admin-on-Reels Actions
    window.adminPinCmt = async (rid, cid, val) => { await fbDb.ref(`shortsComments/${rid}/${cid}/pinned`).set(val); loadCommentsForReel(rid); };
    window.adminDelCmt = async (rid, cid) => { await fbDb.ref(`shortsComments/${rid}/${cid}`).remove(); loadCommentsForReel(rid); };
    window.onCommentUserTap = async (uid, name) => {
      if (!isAdminUser || !uid) return;
      const body = document.getElementById('adminModBody');
      const uSnap = await fbDb.ref(`shortsUsers/${uid}`).once('value');
      const u = uSnap.val() || {};
      body.innerHTML = `
        <div class="p-3 rounded-xl bg-slate-900 border border-slate-700 space-y-2">
          <div class="font-extrabold text-amber-300 text-sm">${name}</div>
          <div class="text-slate-300">जिल्हा: ${u.district || '-'} • वॉर्निंग: ${u.warningCount || 0}/3 • स्थिती: ${u.blocked ? '🚫 ब्लॉक' : '✓ सक्रिय'}</div>
          <div class="flex gap-2">
            <button type="button" onclick="quickWarn('${uid}')" class="flex-1 py-2 rounded-xl bg-amber-400 text-[#031926] font-extrabold">⚠️ वॉर्निंग द्या</button>
            <button type="button" onclick="quickBlock('${uid}', ${!u.blocked})" class="flex-1 py-2 rounded-xl bg-rose-600 text-white font-extrabold">${u.blocked ? '✓ अनब्लॉक' : '🚫 ब्लॉक करा'}</button>
          </div>
        </div>`;
      document.getElementById('adminModSheet').classList.remove('hidden');
    };
    window.quickWarn = async (uid) => {
      const snap = await fbDb.ref(`shortsUsers/${uid}/warningCount`).once('value');
      const next = (snap.val() || 0) + 1;
      await fbDb.ref(`shortsUsers/${uid}`).update({ warningCount: next, blocked: next >= 3 });
      alert(next >= 3 ? '३/३ वॉर्निंग — भक्त ब्लॉक झाले!' : `वॉर्निंग ${next}/3 दिली!`);
      document.getElementById('adminModSheet').classList.add('hidden');
    };
    window.quickBlock = async (uid, val) => {
      await fbDb.ref(`shortsUsers/${uid}/blocked`).set(val);
      alert(val ? 'भक्त ब्लॉक केले!' : 'भक्त अनब्लॉक केले!');
      document.getElementById('adminModSheet').classList.add('hidden');
    };

    document.getElementById('adminModePill').onclick = async () => {
      const snap = await fbDb.ref('shortsUsers').limitToLast(40).once('value');
      const users = Object.entries(snap.val() || {});
      document.getElementById('adminModBody').innerHTML = `
        <a href="admin-shorts.html" class="block text-center py-2.5 rounded-xl bg-amber-400 text-[#031926] font-extrabold">🎛️ संपूर्ण अ‍ॅडमिन शॉर्ट्स पॅनेल उघडा</a>
        <div class="font-bold text-slate-300 pt-1">👥 नोंदणीकृत भक्त (${users.length}):</div>
        ${users.map(([uid, u]) => `<div class="flex items-center justify-between p-2 rounded-xl bg-slate-900 border border-slate-800">
          <span>${u.name || 'भक्त'} (${u.district || '-'})</span>
          <button type="button" onclick="onCommentUserTap('${uid}','${(u.name||'').replace(/'/g,'')}')" class="px-2 py-1 rounded bg-slate-800 text-amber-300 font-bold">मॉडरेट</button>
        </div>`).join('')}`;
      document.getElementById('adminModSheet').classList.remove('hidden');
    };
    document.getElementById('closeAdminModBtn').onclick = () => document.getElementById('adminModSheet').classList.add('hidden');

    // More Options (⋮)
    window.openMore = (idx) => {
      const r = reelsList[idx];
      const items = (shortsCfg.menus && shortsCfg.menus.moreMenu) || [
        { label: '⚠️ या रीलबाबत तक्रार नोंदवा', url: 'profile.html?tab=report' },
        { label: '🛕 मंदिराची संपूर्ण माहिती पहा', url: 'temple-info.html' },
        { label: '🔗 व्हॉट्सॲपवर शेअर करा', url: 'action:share' }
      ];
      let html = items.map(it => {
        if ((it.url || '').includes('report')) return `<a href="profile.html?tab=report&reelId=${encodeURIComponent(r.id)}&reelTitle=${encodeURIComponent(r.templeName)}" class="block p-3 rounded-xl bg-slate-900 border border-slate-800 font-bold text-amber-200">${it.label}</a>`;
        if (it.url === 'action:share') return `<button type="button" onclick="shareReel(${idx});document.getElementById('moreSheet').classList.add('hidden');" class="w-full text-left p-3 rounded-xl bg-slate-900 border border-slate-800 font-bold">${it.label}</button>`;
        return `<a href="${it.url || '#'}" class="block p-3 rounded-xl bg-slate-900 border border-slate-800 font-bold">${it.label}</a>`;
      }).join('');
      if (isAdminUser) {
        html += `<button type="button" onclick="adminHideReel('${r.id}')" class="w-full text-left p-3 rounded-xl bg-rose-950/70 border border-rose-700 font-extrabold text-rose-300">🙈 हे रील फीडमधून लपवा (Admin)</button>`;
      }
      document.getElementById('moreMenuBody').innerHTML = html;
      document.getElementById('moreSheet').classList.remove('hidden');
    };
    document.getElementById('closeMoreBtn').onclick = () => document.getElementById('moreSheet').classList.add('hidden');
    window.adminHideReel = async (rid) => {
      await fbDb.ref(`siteConfig/shortsConfig/feed/hiddenReelIds/${rid}`).set(true);
      document.getElementById('moreSheet').classList.add('hidden');
      alert('रील लपवले गेले!');
      location.reload();
    };

    // Search Sheet
    document.getElementById('openSearchBtn').onclick = () => {
      document.getElementById('searchSheet').classList.remove('hidden');
      renderSearch('');
    };
    document.getElementById('closeSearchBtn').onclick = () => document.getElementById('searchSheet').classList.add('hidden');
    document.getElementById('searchInp').oninput = (e) => renderSearch(e.target.value);
    function renderSearch(q) {
      const term = (q || '').trim().toLowerCase();
      const matched = reelsList.filter(r => !r.isAd && (!term || r.templeName.toLowerCase().includes(term)));
      document.getElementById('searchResults').innerHTML = matched.slice(0, 20).map(r => `
        <button type="button" onclick="jumpToReel('${r.id}')" class="w-full flex items-center gap-2.5 p-2 rounded-xl bg-slate-900 border border-slate-800 text-left">
          <img src="${r.templeImg}" class="w-9 h-9 rounded-full object-cover"/>
          <div><div class="font-bold text-amber-200">${r.templeName}</div><div class="text-[10px] text-slate-400">${r.date}</div></div>
        </button>`).join('');
    }
    window.jumpToReel = (rid) => {
      document.getElementById('searchSheet').classList.add('hidden');
      const el = document.querySelector(`.reel[data-rid="${rid}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    // Vertical Live Darshan OTT Popup
    window.openLivePopup = (idx) => {
      const r = reelsList[idx];
      if (!r || !r.liveUrl) return;
      document.getElementById('bgAudio').pause();
      document.getElementById('liveTitle').textContent = '🔴 ' + r.templeName + ' — लाईव्ह दर्शन';
      const lp = shortsCfg.livePopup || {};
      const wm = document.getElementById('liveWatermark');
      wm.textContent = lp.watermarkText || 'दर्शन सेतू . लाईव्ह';
      wm.style.opacity = lp.watermarkOpacity ?? 0.75;
      document.getElementById('liveDisclaimer').textContent = lp.disclaimer || 'ही लाईव्ह स्ट्रीम संबंधित देवस्थानच्या अधिकृत प्रसारणातून दाखवली जात आहे.';

      const vid = document.getElementById('liveVideo');
      const ifr = document.getElementById('liveIframe');
      vid.classList.add('hidden'); ifr.classList.add('hidden');
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

      if (r.liveUrl.includes('.m3u8')) {
        vid.classList.remove('hidden');
        if (window.Hls && Hls.isSupported()) {
          hlsInstance = new Hls(); hlsInstance.loadSource(r.liveUrl); hlsInstance.attachMedia(vid);
        } else { vid.src = r.liveUrl; }
        vid.play().catch(() => {});
      } else {
        let embed = r.liveUrl;
        if (embed.includes('watch?v=')) embed = 'https://www.youtube.com/embed/' + embed.split('watch?v=')[1].split('&')[0] + '?autoplay=1';
        else if (embed.includes('youtu.be/')) embed = 'https://www.youtube.com/embed/' + embed.split('youtu.be/')[1].split('?')[0] + '?autoplay=1';
        ifr.src = embed;
        ifr.classList.remove('hidden');
      }
      document.getElementById('livePopup').classList.remove('hidden');
    };
    document.getElementById('closeLiveBtn').onclick = () => {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      const vid = document.getElementById('liveVideo');
      vid.pause(); vid.src = '';
      document.getElementById('liveIframe').src = '';
      document.getElementById('livePopup').classList.add('hidden');
    };

    boot();
  </script>
</body>
</html>
